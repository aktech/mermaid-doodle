# Publishes mermaid-doodle to npm using OIDC trusted publishing instead of a
# long-lived NPM_TOKEN secret. This file intentionally carries no secret.
#
# Bootstrap requirement: npm trusted publishing cannot perform a package's
# very first publish (this is a known npm CLI limitation, npm/cli#8544, open
# as of this writing). The first release (0.1.0) has to be published by hand
# from a maintainer machine with `npm publish`. Once that first version
# exists on the registry, a maintainer must open this package on npmjs.com
# and add a trusted publisher pointing at repository aktech/mermaid-doodle
# and workflow filename publish.yml. Only after that trusted publisher is
# configured can this workflow publish without any stored credential.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        # Trusted publishing needs npm CLI 11.5.1 or newer. Node 22 ships an
        # older bundled npm, so it has to be upgraded before anything else
        # runs. 12.1.0 is npm's current release line.
        run: npm install -g npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:dom

      - name: Publish to npm
        # npm publish runs the prepublishOnly hook (typecheck plus unit
        # tests) and the prepack hook (build) before it uploads anything, so
        # those two are not repeated as separate steps here. Authentication
        # comes from the OIDC token GitHub mints for this job, exchanged by
        # npm for a short-lived publish token; no NODE_AUTH_TOKEN is set.
        run: npm publish --access public --provenance
