<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>hero fixture</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/dist/styles.css" />
    <style>
      :root {
        --doodle-font: 'Shantell Sans', cursive;
        --doodle-accent: #6d28d9;
        --doodle-node-bg: #efe7ff;
        --doodle-node-text: #2e1065;
        --doodle-alt-bg: #f5f0ff;
        --doodle-alt-border: #c4b5fd;
        --doodle-cluster-bg: #ffffff;
        --doodle-cluster-border: #ddd6fe;
        --doodle-text: #3b0764;
        --doodle-edge-label-bg: #f7f3ff;
      }
      [data-theme='dark'] {
        --doodle-accent: #a78bfa;
        --doodle-node-bg: #241b3d;
        --doodle-node-text: #ede9fe;
        --doodle-alt-bg: #2a2050;
        --doodle-alt-border: #7c3aed;
        --doodle-cluster-bg: #17122b;
        --doodle-cluster-border: #4c1d95;
        --doodle-text: #ede9fe;
        --doodle-edge-label-bg: #1c1633;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #f7f3ff;
      }
      [data-theme='dark'] body {
        background: #120e21;
      }
      /* The screenshot script crops to the rendered diagram's own measured
         bounding box plus a fixed margin, not to this wrapper, so no
         padding is needed here: it would just be extra, uncropped space. */
    </style>
  </head>
  <body>
    <pre class="mermaid">flowchart LR
  Browser["Browser"] --&gt; CDN["CDN"]
  CDN --&gt; Gateway["API Gateway"]
  subgraph Services["Services"]
    Auth["Auth"]
    Render["Render"]
  end
  Gateway --&gt; Auth
  Gateway --&gt; Render
  Auth --&gt; DB[("Database")]
  Render --&gt; DB</pre>
    <script type="module">
      import mermaid from '/node_modules/mermaid/dist/mermaid.esm.mjs';
      import * as doodle from '/dist/index.js';

      window.doodle = doodle;
      window.renderer = doodle.createRenderer({ mermaid });
      await window.renderer.mount();
      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
