<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8"><title>render fixture</title>
    <style>
      :root { --doodle-accent: #5b3cc4; --doodle-node-bg: #ece7f8; }
      [data-theme="dark"] { --doodle-accent: #8b5cf6; --doodle-node-bg: #1c1633; }
    </style>
  </head>
  <body>
    <div class="doodle-wrap" data-doodle-source>
      <pre class="mermaid" id="d1">graph LR
  A["start"] --> B["end"]</pre>
    </div>
    <!-- Starlight/Astro Expressive Code shape: no .mermaid class, no
         pre-existing .doodle-wrap ancestor, unlike the pre.mermaid d1 above. -->
    <pre data-language="mermaid" id="d2">graph LR
  C["start"] --> D["end"]</pre>
    <!-- Prism / Rouge / highlight.js shape. The selector matches the <code>
         child, but the container is its parent <pre>, and the first render
         replaces that child with the diagram, so nothing about this <pre>
         matches DEFAULT_SELECTOR any more once it has been rendered once. -->
    <pre id="d3"><code class="language-mermaid">graph LR
  E["start"] --&gt; F["end"]</code></pre>
    <script type="module">
      import mermaid from '/node_modules/mermaid/dist/mermaid.esm.mjs';
      import * as doodle from '/dist/index.js';
      window.doodle = doodle;
      window.renderer = doodle.createRenderer({ mermaid });
      await window.renderer.mount();
      window.ready = true;
    </script>
  </body>
</html>
