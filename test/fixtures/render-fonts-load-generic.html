<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8"><title>render fonts-load-generic fixture</title>
    <style>:root { --doodle-font: sans-serif, "Some Other Font"; }</style>
  </head>
  <body>
    <div class="doodle-wrap">
      <pre class="mermaid" id="d1">graph LR
  A["start"] --> B["end"]</pre>
    </div>
    <script type="module">
      import * as doodle from '/dist/index.js';

      const loadCalls = [];
      window.loadCalls = loadCalls;
      const calls = [];
      window.calls = calls;
      Object.defineProperty(document, 'fonts', {
        configurable: true,
        value: {
          ready: Promise.resolve(),
          load(spec) {
            loadCalls.push(spec);
            return Promise.resolve([]);
          },
        },
      });

      const mermaid = {
        initialize() {},
        run() { calls.push(Date.now()); },
      };

      window.doodle = doodle;
      window.renderer = doodle.createRenderer({ mermaid });
      window.mountPromise = window.renderer.mount();
      window.ready = true;
    </script>
  </body>
</html>
