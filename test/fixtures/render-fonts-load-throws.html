<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8"><title>render fonts-load-throws fixture</title>
    <style>:root { --doodle-font: "Test Doodle Font", cursive; }</style>
  </head>
  <body>
    <div class="doodle-wrap">
      <pre class="mermaid" id="d1">graph LR
  A["start"] --> B["end"]</pre>
    </div>
    <script type="module">
      import * as doodle from '/dist/index.js';

      // document.fonts.load throws synchronously here, to prove a failing
      // explicit font request still degrades to rendering rather than
      // blocking it.
      Object.defineProperty(document, 'fonts', {
        configurable: true,
        value: {
          ready: Promise.resolve(),
          load() {
            throw new Error('boom');
          },
        },
      });

      const calls = [];
      window.calls = calls;
      const mermaid = {
        initialize() {},
        run() { calls.push(Date.now()); },
      };

      window.doodle = doodle;
      window.renderer = doodle.createRenderer({ mermaid });
      window.mountPromise = window.renderer.mount();
      window.ready = true;
    </script>
  </body>
</html>
