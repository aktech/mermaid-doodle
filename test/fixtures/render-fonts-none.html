<!doctype html>
<html lang="en" data-theme="light">
  <head><meta charset="utf-8"><title>render fonts-none fixture</title></head>
  <body>
    <div class="doodle-wrap">
      <pre class="mermaid" id="d1">graph LR
  A["start"] --> B["end"]</pre>
    </div>
    <script type="module">
      import * as doodle from '/dist/index.js';

      // document.fonts is absent in this fixture, to prove the renderer
      // guards it rather than hanging or throwing.
      Object.defineProperty(document, 'fonts', { configurable: true, value: undefined });

      const calls = [];
      window.calls = calls;
      const mermaid = {
        initialize() {},
        run() { calls.push(Date.now()); },
      };

      window.doodle = doodle;
      window.renderer = doodle.createRenderer({ mermaid });
      window.mountPromise = window.renderer.mount();
      window.ready = true;
    </script>
  </body>
</html>
