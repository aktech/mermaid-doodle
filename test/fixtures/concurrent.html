<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8"><title>concurrent render fixture</title>
    <style>
      :root { --doodle-accent: #5b3cc4; }
      [data-theme="dark"] { --doodle-accent: #8b5cf6; }
    </style>
  </head>
  <body>
    <pre class="mermaid" id="d1">graph LR
  A --> B</pre>
    <script type="module">
      import * as doodle from '/dist/index.js';

      // A stand-in for mermaid that makes the ordering observable and the
      // race deterministic: it writes the line colour it was configured with
      // as the diagram's content, after a delay this fixture chooses per
      // call. Real mermaid takes a variable few tens of milliseconds, which
      // is long enough for a second theme change to land mid-render but far
      // too jittery to assert on.
      //
      // Call 0 is the mount render, call 1 is deliberately the slow one, so
      // a render started after it would finish first and its output would be
      // overwritten by the older one.
      const DELAYS = [10, 120, 10];
      window.runs = [];

      let call = 0;
      let config = null;
      const mermaid = {
        initialize(next) { config = next; },
        async run({ nodes }) {
          // Read synchronously, before yielding: a render that started
          // earlier must report the palette it was configured with, not one
          // a later render installed while it was in flight.
          const line = config.themeVariables.lineColor;
          const delay = DELAYS[call++] ?? 10;
          await new Promise((resolve) => setTimeout(resolve, delay));
          for (const node of nodes) {
            node.textContent = line;
            node.setAttribute('data-processed', 'true');
          }
          window.runs.push(line);
        },
      };

      window.renderer = doodle.createRenderer({ mermaid, cdnUrl: null });
      await window.renderer.mount();
      window.ready = true;
    </script>
  </body>
</html>
